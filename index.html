function initClock(){

  function drawClock(){
    var size=300; canvas.width=size; canvas.height=size; var cx=size/2, cy=size/2; var radius=132; ctx.clearRect(0,0,size,size);
    ctx.beginPath(); ctx.arc(cx,cy,radius+8,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
    var bgGrad=ctx.createRadialGradient(cx-30,cy-30,10,cx,cy,radius); bgGrad.addColorStop(0,'#1e3a45'); bgGrad.addColorStop(0.5,'#122a32'); bgGrad.addColorStop(1,'#081820');

    ctx.beginPath(); ctx.arc(cx,cy,radius-2,0,Math.PI*2); ctx.strokeStyle='#4ecca3'; ctx.lineWidth=3; ctx.stroke();

    var smoothSec=seconds+ms/1000; var smoothMin=minutes+smoothSec/60; var smoothHour=hours+smoothMin/60;
    for(var i=0;i<60;i++){ var angle=(i*6-90)*Math.PI/180; var isHour=i%5===0; var len=isHour?18:7; var w=isHour?3:1; var r1=radius-16-len; var r2=radius-16; var x1=cx+r1*Math.cos(angle); var y1=cy+r1*Math.sin(angle); var x2=cx+r2*Math.cos(angle); var y2=cy+r2*Math.sin(angle); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=isHour?'#4ecca3':'rgba(78,204,163,0.35)'; ctx.lineWidth=w; ctx.lineCap='round'; ctx.stroke(); }
    ctx.fillStyle='#e0ffee'; ctx.font='bold 22px Segoe UI, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var h=1;h<=12;h++){ var ang=(h*30-90)*Math.PI/180; var tx=cx+(radius-42)*Math.cos(ang); var ty=cy+(radius-42)*Math.sin(ang); ctx.shadowColor='#4ecca3'; ctx.shadowBlur=8; ctx.fillText(h.toString(),tx,ty); ctx.shadowBlur=0; }

    var secAngle=(smoothSec*6-90)*Math.PI/180; ctx.save(); ctx.translate(cx,cy); ctx.rotate(secAngle); ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-22,-1); ctx.lineTo(radius*0.82,-1); ctx.lineTo(radius*0.82,1); ctx.lineTo(-22,1); ctx.closePath(); ctx.fillStyle='#ff4d6d'; ctx.fill(); ctx.beginPath(); ctx.arc(radius*0.82+6,0,6,0,Math.PI*2); ctx.fillStyle='#ff4d6d'; ctx.fill(); ctx.beginPath(); ctx.arc(radius*0.82+6,0,2.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.beginPath(); ctx.arc(-12,0,7,0,Math.PI*2); ctx.fillStyle='#ff4d6d'; ctx.fill(); ctx.restore();

function updateDateByCalendar(){
  var cal=document.getElementById('calendarSelect').value; var now=new Date(); var formatted='';
  try{
    if(cal==='gregorian'){ var days=['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag']; var months=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december']; formatted=days[now.getDay()]+'<br>'+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear(); }
    else if(cal==='islamic'){ try{ var hijriEn=new Intl.DateTimeFormat('en-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(now); formatted='Islamisk<br>'+hijriEn; }catch(e2){ formatted='Islamisk<br>(ej stödd)'; } }
    else if(cal==='iranian'){ try{ var persianEn=new Intl.DateTimeFormat('en-u-ca-persian',{day:'numeric',month:'long',year:'numeric'}).format(now); formatted='Iransk<br>'+persianEn; }catch(e3){ formatted='Iransk<br>(ej stödd)'; } }
  }catch(e){ formatted=now.toDateString(); }
  document.getElementById('dateDisplay').innerHTML=formatted;
}

var quranIndex=0,quranInterval=null,quranProgressInterval=null;
function showQuranAyah(idx){
  var ayah=quranAyahs[idx%quranAyahs.length]; var bar=document.getElementById('quranBar');
  bar.style.opacity='0'; bar.style.transform='translateY(-8px)';
  setTimeout(function(){
    document.getElementById('quranArabic').innerText=ayah.ar;
    document.getElementById('quranKu').innerHTML='<b>KURMANCÎ</b><br>'+ayah.ku;
    document.getElementById('quranSo').innerHTML='<b>SORANÎ / سۆرانی</b><br>'+ayah.so;
    document.getElementById('quranFa').innerHTML='<b>فارسی</b><br>'+ayah.fa;
    document.getElementById('quranRef').innerText=ayah.ref;
    bar.style.transition='all 0.6s ease'; bar.style.opacity='1'; bar.style.transform='translateY(0)';
  },250);
  try{localStorage.setItem('quran_idx',idx.toString()); localStorage.setItem('quran_time',Date.now().toString());}catch(e){}
}
function startQuranRotation(){
  try{ var savedIdx=parseInt(localStorage.getItem('quran_idx')||'0'); var savedTime=parseInt(localStorage.getItem('quran_time')||'0'); if(savedTime){ var m=Math.floor((Date.now()-savedTime)/(5*60*1000)); quranIndex=(savedIdx+m)%quranAyahs.length; } else { quranIndex=Math.floor(Date.now()/(5*60*1000))%quranAyahs.length; } }catch(e){ quranIndex=Math.floor(Date.now()/(5*60*1000))%quranAyahs.length; }
  showQuranAyah(quranIndex);
  var startTime=Date.now(); var duration=5*60*1000;
  if(quranProgressInterval) clearInterval(quranProgressInterval);
  quranProgressInterval=setInterval(function(){ var elapsed=Date.now()-startTime; var pct=Math.min(100,(elapsed/duration)*100); var el=document.getElementById('quranProgress'); if(el) el.style.width=pct+'%'; if(pct>=100){ if(el) el.style.width='0%'; startTime=Date.now(); } },120);
  if(quranInterval) clearInterval(quranInterval);
  quranInterval=setInterval(function(){ quranIndex=(quranIndex+1)%quranAyahs.length; showQuranAyah(quranIndex); startTime=Date.now(); },5*60*1000);
  var qb=document.getElementById('quranBar'); if(qb){ qb.addEventListener('click',function(){ quranIndex=(quranIndex+1)%quranAyahs.length; showQuranAyah(quranIndex); startTime=Date.now(); var el=document.getElementById('quranProgress'); if(el) el.style.width='0%'; }); qb.style.cursor='pointer'; qb.title='Klicka för nästa ayah'; }
}

// ===== WEATHER WITH 7-DAY FORECAST =====
function weatherCodeToIcon(code){
  // WMO codes
  if(code===0) return {icon:'☀️', text:'Klart'};
  if(code===1) return {icon:'🌤️', text:'Mest klart'};
  if(code===2) return {icon:'⛅', text:'Delvis molnigt'};
  if(code===3) return {icon:'☁️', text:'Molnigt'};
  if(code>=45&&code<=48) return {icon:'🌫️', text:'Dimma'};
  if(code>=51&&code<=55) return {icon:'🌦️', text:'Duggregn'};
  if(code>=61&&code<=67) return {icon:'🌧️', text:'Regn'};
  if(code>=71&&code<=77) return {icon:'❄️', text:'Snö'};
  if(code===80||code===81) return {icon:'🌦️', text:'Skurar'};
  if(code===82) return {icon:'🌧️', text:'Kraftiga skurar'};
  if(code===85||code===86) return {icon:'🌨️', text:'Snöskurar'};
  if(code>=95) return {icon:'⛈️', text:'Åska'};
  return {icon:'☀️', text:'Klart'};
}
function fetchWeather(){
  var city=document.getElementById('cityInput').value.trim();
  var country=document.getElementById('countryInput').value.trim();
  if(!city){ document.getElementById('weatherInfo').innerHTML='Ange stad'; return; }
  document.getElementById('weatherInfo').innerHTML='Söker...'; document.getElementById('weatherWeek').innerHTML='';
  var geocodeUrl='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=5&language=sv&format=json';
  if(country) geocodeUrl+='&country='+encodeURIComponent(country);
  fetch(geocodeUrl).then(function(r){ return r.json(); }).then(function(geoData){
    if(!geoData.results||geoData.results.length===0) throw new Error('Stad ej hittad');
    var loc=geoData.results[0]; var lat=loc.latitude, lon=loc.longitude;
    var weatherUrl='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';
    return fetch(weatherUrl).then(function(r2){ return r2.json(); }).then(function(wData){ return {wData:wData,loc:loc}; });
  }).then(function(result){
    var wData=result.wData, loc=result.loc;
    if(wData.current_weather){
      var cur=wData.current_weather; var curIcon=weatherCodeToIcon(cur.weathercode);
      document.getElementById('weatherInfo').innerHTML=curIcon.icon+' '+cur.temperature+'°C '+curIcon.text+'<br><span style="font-size:0.8em;opacity:0.7;">Vind '+cur.windspeed+' m/s · '+loc.name+', '+loc.country+'</span>';
    }
    // weekly
    if(wData.daily){
      var days=['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
      var weekHtml='';
      for(var i=0;i<wData.daily.time.length;i++){
        var date=new Date(wData.daily.time[i]);
        var dayName=i===0?'Idag':days[date.getDay()];
        var code=wData.daily.weathercode[i];
        var iconInfo=weatherCodeToIcon(code);
        var max=Math.round(wData.daily.temperature_2m_max[i]);
        var min=Math.round(wData.daily.temperature_2m_min[i]);
        var isToday=i===0?' today':'';
        weekHtml+='<div class="weather-day'+isToday+'"><div class="wd-name">'+dayName+'</div><div class="wd-icon">'+iconInfo.icon+'</div><div class="wd-temp">'+max+'°</div><div class="wd-min">'+min+'° · '+iconInfo.text+'</div></div>';
      }
      document.getElementById('weatherWeek').innerHTML=weekHtml;
    }
  }).catch(function(err){ document.getElementById('weatherInfo').innerHTML='Fel: '+err.message; });
}

});
